name: Deploy JieGe website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "snapflow-website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Connect website to JieGe Cloud
        env:
          JIEGE_CLOUD_API_URL: ${{ vars.JIEGE_CLOUD_API_URL }}
        run: |
          node -e "const fs=require('fs'); const url=String(process.env.JIEGE_CLOUD_API_URL||'').replace(/\/+$/,''); fs.writeFileSync('snapflow-website/config.js','window.JIEGE_CONFIG = Object.freeze({ cloudApiUrl: '+JSON.stringify(url)+' })\\n')"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./snapflow-website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
