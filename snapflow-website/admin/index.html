<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090b12">
  <title>截哥 Cloud 管理台</title>
  <style>
    :root{color-scheme:dark;--bg:#090b12;--panel:#111521;--panel2:#171c2a;--line:#293044;--ink:#f4f7fb;--muted:#97a4b8;--accent:#21d4a7;--accent-ink:#062019;--danger:#ff7a90;--warn:#ffcb6b;--radius:14px;--shadow:0 24px 80px rgba(2,7,14,.46)}
    *{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 78% 0,rgba(33,212,167,.11),transparent 30rem),var(--bg);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a{color:inherit}.hidden{display:none!important}
    .aurora{position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(33,212,167,.045) 49%,transparent 72%);background-size:220% 100%;animation:sweep 9s linear infinite}@keyframes sweep{to{background-position:-220% 0}}@media(prefers-reduced-motion:reduce){.aurora{animation:none}}
    .auth-shell{min-height:100dvh;display:grid;place-items:center;padding:24px}.auth-card{width:min(460px,100%);padding:30px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(17,21,33,.95);box-shadow:var(--shadow)}.wordmark{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:24px;box-shadow:0 0 28px rgba(33,212,167,.28)}h1,h2,h3,p{margin-top:0}.auth-card h1{font-size:28px;margin-bottom:8px}.muted{color:var(--muted)}.form-grid{display:grid;gap:14px}label{display:grid;gap:7px;color:#dbe2ed;font-size:14px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#0b0f18;color:var(--ink);padding:11px 12px;outline:none}textarea{resize:vertical;min-height:100px}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(33,212,167,.13)}.button{border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);padding:10px 14px;font-weight:700}.button:hover{border-color:var(--accent)}.button:active{transform:translateY(1px)}.button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.button.danger{color:#ffd7df;border-color:rgba(255,122,144,.4)}.button.full{width:100%}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.notice{border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--muted);background:rgba(255,255,255,.02)}.notice.error{border-color:rgba(255,122,144,.5);color:#ffd7df;background:rgba(255,122,144,.07)}.notice.ok{border-color:rgba(33,212,167,.5);color:#b9f9e9;background:rgba(33,212,167,.07)}
    .app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100dvh}.sidebar{position:sticky;top:0;height:100dvh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(10,13,21,.92);backdrop-filter:blur(18px);z-index:3}.sidebar .wordmark{margin:0 8px 26px}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;border-radius:9px;background:transparent;color:var(--muted);padding:10px 12px;text-align:left;font-weight:650}.nav button:hover,.nav button.active{background:rgba(33,212,167,.1);color:var(--ink)}.nav button.active{box-shadow:inset 3px 0 var(--accent)}.sidebar-foot{position:absolute;left:16px;right:16px;bottom:20px;border-top:1px solid var(--line);padding-top:15px}.sidebar-foot small{display:block;color:var(--muted);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .main{min-width:0;padding:24px 28px 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.topbar h1{font-size:25px;margin:0}.api-state{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.api-state i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:18px 0;border-top:1px solid var(--line)}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:29px;margin-top:5px}.section{margin-top:26px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px}.section-head h2{font-size:20px;margin:0}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.panel{border:1px solid var(--line);border-radius:var(--radius);background:rgba(17,21,33,.84);overflow:hidden}.toolbar{display:flex;gap:10px;padding:13px;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar input,.toolbar select{width:auto;min-width:180px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 14px;text-align:left;border-bottom:1px solid rgba(41,48,68,.72);vertical-align:top}.table th{position:sticky;top:0;background:#151a28;color:var(--muted);font-size:12px;letter-spacing:.04em}.table td{font-size:13px}.table tbody tr:hover{background:rgba(33,212,167,.035)}.table tr:last-child td{border-bottom:0}.cell-title{max-width:360px}.cell-title b{display:block}.cell-title small{display:block;color:var(--muted);margin-top:4px}.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--muted)}.badge.published,.badge.active,.badge.paid,.badge.completed{border-color:rgba(33,212,167,.38);color:#9ef4dd}.badge.withdrawn,.badge.closed,.badge.failed,.badge.suspended{border-color:rgba(255,122,144,.42);color:#ffc0cc}.badge.pending,.badge.draft{border-color:rgba(255,203,107,.42);color:#ffe0a0}.empty,.loading{padding:44px 20px;text-align:center;color:var(--muted)}.loading{background:linear-gradient(100deg,transparent,rgba(255,255,255,.04),transparent);background-size:220% 100%;animation:sweep 1.4s linear infinite}.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:13px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    dialog{width:min(680px,calc(100% - 28px));max-height:calc(100dvh - 40px);border:1px solid var(--line);border-radius:var(--radius);padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}dialog::backdrop{background:rgba(3,6,12,.72);backdrop-filter:blur(4px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:20px}.dialog-body{padding:20px;overflow:auto;max-height:calc(100dvh - 150px)}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.toast{position:fixed;right:22px;bottom:22px;max-width:min(420px,calc(100% - 44px));padding:12px 15px;border:1px solid var(--line);border-radius:10px;background:#111723;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}.toast.error{border-color:rgba(255,122,144,.55)}
    @media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}.sidebar .wordmark{margin-bottom:12px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.sidebar-foot{position:static;display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px}.sidebar-foot small{margin:0}.main{padding:20px 16px 50px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.metrics{grid-template-columns:1fr}.topbar,.section-head{align-items:flex-start;flex-direction:column}.toolbar>*{width:100%!important}.auth-card{padding:22px}.inline .button{flex:1}}
  </style>
</head>
<body>
<div class="aurora"></div>
<section class="auth-shell" id="authShell">
  <div class="auth-card">
    <div class="wordmark"><span class="mark">截</span><div><b>截哥 Cloud</b><div class="muted">管理员控制台</div></div></div>
    <div id="apiSetup" class="form-grid hidden">
      <div><h1>连接 Cloud API</h1><p class="muted">首次部署后填写 HTTPS API 地址。本页面只在当前浏览器保存地址。</p></div>
      <label>Cloud API 地址<input id="apiUrl" type="url" placeholder="https://cloud.example.com" autocomplete="url"></label>
      <button class="button primary full" id="saveApi">保存并检查</button>
    </div>
    <form id="loginForm" class="form-grid hidden">
      <div><h1>管理员登录</h1><p class="muted">会话令牌仅保存在当前标签页，关闭标签页后自动清除。</p></div>
      <label>管理员账号<input name="username" autocomplete="username" required minlength="3"></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required minlength="12"></label>
      <div class="notice error hidden" id="loginError"></div>
      <button class="button primary full" type="submit">登录管理台</button>
      <button class="button full" type="button" id="changeApi">更换 API 地址</button>
    </form>
    <form id="bootstrapForm" class="form-grid hidden">
      <div><h1>创建首位管理员</h1><p class="muted">仅在数据库没有管理员时出现。成功后初始化入口会关闭。</p></div>
      <label>管理员账号<input name="username" autocomplete="username" required minlength="3"></label>
      <label>显示名称<input name="displayName" autocomplete="name" required></label>
      <label>管理员密码<input name="password" type="password" autocomplete="new-password" required minlength="12"></label>
      <label>一次性初始化令牌<input name="bootstrapToken" type="password" autocomplete="off" required></label>
      <div class="notice">密码至少 12 位，并同时包含字母和数字。初始化令牌来自服务器环境变量。</div>
      <div class="notice error hidden" id="bootstrapError"></div>
      <button class="button primary full" type="submit">创建管理员</button>
    </form>
  </div>
</section>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="wordmark"><span class="mark">截</span><div><b>截哥 Cloud</b><div class="muted">ADMIN</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><small id="adminName"></small><button class="button" id="logout">退出</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="pageTitle">运营概览</h1><div class="api-state"><i></i><span id="apiLabel"></span></div></header>
    <div id="content"></div>
  </main>
</div>

<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="close" id="dialogClose" aria-label="关闭">×</button></div><div class="dialog-body" id="dialogBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../config.js"></script>
<script>
(() => {
  const $ = (selector, root=document) => root.querySelector(selector)
  const authShell=$('#authShell'),apiSetup=$('#apiSetup'),loginForm=$('#loginForm'),bootstrapForm=$('#bootstrapForm'),app=$('#app'),content=$('#content'),dialog=$('#dialog'),toast=$('#toast')
  const pages=[['dashboard','运营概览'],['literature','文献管理'],['users','用户与余额'],['orders','订单管理'],['recharges','充值记录'],['logs','操作日志'],['backups','数据库备份'],['admins','管理员']]
  const state={api:'',token:sessionStorage.getItem('jiege-admin-token')||'',admin:null,page:'dashboard',categories:[],literaturePage:1,literatureQuery:'',literatureStatus:'',userPage:1}
  function cleanApi(value){try{const u=new URL(String(value||'').trim());if(u.protocol!=='https:'&&u.hostname!=='localhost'&&u.hostname!=='127.0.0.1')throw 0;return u.toString().replace(/\/+$/,'')}catch{throw new Error('请输入有效的 HTTPS Cloud API 地址')}}
  function setAuthView(id){[apiSetup,loginForm,bootstrapForm].forEach(x=>x.classList.toggle('hidden',x.id!==id));authShell.classList.remove('hidden');app.classList.add('hidden')}
  function showToast(message,error=false){toast.textContent=message;toast.classList.toggle('error',error);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600)}
  function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
  function formatTime(value){return value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'无'}
  function formatMoney(cents,currency='usd'){return new Intl.NumberFormat('zh-CN',{style:'currency',currency:String(currency||'usd').toUpperCase()}).format(Number(cents||0)/100)}
  function formatSize(bytes){const n=Number(bytes||0);return n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024).toFixed(1)+' KB':n+' B'}
  async function api(path,options={}){const response=await fetch(state.api+path,{...options,headers:{'content-type':'application/json',...(state.token?{authorization:'Bearer '+state.token}:{}),...(options.headers||{})}});if(response.status===401&&state.token){logout();throw new Error('登录已失效，请重新登录')}const type=response.headers.get('content-type')||'';if(!response.ok){let message='请求失败';try{message=type.includes('json')?(await response.json()).message:await response.text()}catch{}throw new Error(message||`HTTP ${response.status}`)}return type.includes('json')?response.json():response}
  async function detect(){state.api=localStorage.getItem('jiege-cloud-api')||window.JIEGE_CONFIG?.cloudApiUrl||'';if(!state.api){setAuthView('apiSetup');return}try{state.api=cleanApi(state.api);const status=await api('/v1/admin/bootstrap/status');if(!status.configured){setAuthView('bootstrapForm');return}if(!state.token){setAuthView('loginForm');return}const me=await api('/v1/admin/me');state.admin=me.admin;enter()}catch(error){state.token='';sessionStorage.removeItem('jiege-admin-token');setAuthView('apiSetup');showToast(error.message,true)}}
  function logout(){state.token='';state.admin=null;sessionStorage.removeItem('jiege-admin-token');setAuthView('loginForm')}
  function enter(){authShell.classList.add('hidden');app.classList.remove('hidden');$('#adminName').textContent=`${state.admin.displayName||state.admin.username} · ${state.admin.role}`;$('#apiLabel').textContent=state.api.replace(/^https?:\/\//,'');renderNav();navigate(state.page)}
  function renderNav(){const allowed={owner:pages,editor:pages.filter(x=>['dashboard','literature'].includes(x[0])),finance:pages.filter(x=>['dashboard','users','orders','recharges'].includes(x[0])),viewer:pages.filter(x=>x[0]==='dashboard')}[state.admin.role]||[];$('#nav').innerHTML=allowed.map(([id,label])=>`<button data-page="${id}" class="${id===state.page?'active':''}">${label}</button>`).join('');$('#nav').querySelectorAll('button').forEach(button=>button.onclick=()=>navigate(button.dataset.page))}
  function loading(){content.innerHTML='<div class="panel loading">正在读取 Cloud 数据...</div>'}
  function panelError(error){content.innerHTML=`<div class="notice error">${escapeHtml(error.message||error)}</div>`}
  async function navigate(page){state.page=page;renderNav();$('#pageTitle').textContent=pages.find(x=>x[0]===page)?.[1]||'截哥 Cloud';loading();try{await ({dashboard:renderDashboard,literature:renderLiterature,users:renderUsers,orders:renderOrders,recharges:()=>renderSimpleList('recharges'),logs:()=>renderSimpleList('logs'),backups:renderBackups,admins:renderAdmins}[page]||renderDashboard)()}catch(error){panelError(error)}}
  async function renderDashboard(){const d=await api('/v1/admin/dashboard');const metrics=[['用户总数',d.users],['已发布文献',d.publishedLiterature],['已支付订单',d.paidOrders],['累计收入',formatMoney(d.revenueCents)],['未消耗积分',Number(d.outstandingCredits||0).toLocaleString()],['24 小时操作',d.operations24h]];content.innerHTML=`<section class="metrics">${metrics.map(x=>`<article class="metric"><span>${x[0]}</span><strong>${x[1]??0}</strong></article>`).join('')}</section><section class="section"><div class="section-head"><div><h2>系统状态</h2><p>管理操作全部通过 Cloud API，并写入不可静默修改的审计记录。</p></div></div><div class="panel"><div class="empty">数据库已连接。管理员会话、文献、余额与订单共用同一权限边界。</div></div></section>`}
  async function loadCategories(){const data=await api('/v1/admin/categories');state.categories=data.items||[]}
  function literatureForm(item={}){return `<form id="literatureForm" class="form-grid"><input type="hidden" name="id" value="${escapeHtml(item.id||'')}"><label>标题<input name="title" value="${escapeHtml(item.title||'')}" required maxlength="500"></label><label>作者（用分号分隔）<input name="authors" value="${escapeHtml((item.authors||[]).join('; '))}"></label><div class="inline"><label style="flex:1">年份<input name="year" type="number" min="1500" max="2200" value="${escapeHtml(item.year||'')}"></label><label style="flex:2">DOI<input name="doi" value="${escapeHtml(item.doi||'')}"></label></div><label>原文链接<input name="url" type="url" value="${escapeHtml(item.url||'')}"></label><label>分类<select name="categoryId"><option value="">未分类</option>${state.categories.map(c=>`<option value="${c.id}" ${c.id===item.categoryId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></label><label>状态<select name="status">${[['draft','草稿'],['published','发布'],['withdrawn','下架']].map(x=>`<option value="${x[0]}" ${x[0]===(item.status||'draft')?'selected':''}>${x[1]}</option>`).join('')}</select></label><label>关键词（逗号分隔）<input name="keywords" value="${escapeHtml((item.keywords||[]).join(', '))}"></label><label>摘要<textarea name="abstract">${escapeHtml(item.abstract||'')}</textarea></label><label>来源<input name="source" value="${escapeHtml(item.source||'')}"></label><label>内部备注<textarea name="notes">${escapeHtml(item.notes||'')}</textarea></label><div class="dialog-actions"><button type="button" class="button" data-close>取消</button><button class="button primary" type="submit">保存文献</button></div></form>`}
  function openDialog(title,html){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=html;dialog.showModal();$('#dialogBody [data-close]')?.addEventListener('click',()=>dialog.close())}
  async function renderLiterature(){await loadCategories();const data=await api(`/v1/admin/literature?page=${state.literaturePage}&limit=50&q=${encodeURIComponent(state.literatureQuery)}&status=${encodeURIComponent(state.literatureStatus)}`);content.innerHTML=`<section><div class="section-head"><div><h2>文献库</h2><p>草稿不会出现在官网与桌面端；发布后立即进入公共接口。</p></div><div class="inline"><button class="button" id="categoryAdd">管理分类</button><button class="button" id="bulkImport">批量导入</button><button class="button primary" id="literatureAdd">新增文献</button></div></div><div class="panel"><div class="toolbar"><input id="literatureSearch" placeholder="搜索标题或 DOI" value="${escapeHtml(state.literatureQuery)}"><select id="literatureStatus"><option value="">全部状态</option><option value="draft" ${state.literatureStatus==='draft'?'selected':''}>草稿</option><option value="published" ${state.literatureStatus==='published'?'selected':''}>已发布</option><option value="withdrawn" ${state.literatureStatus==='withdrawn'?'selected':''}>已下架</option></select><button class="button" id="literatureFilter">筛选</button></div><div class="table-wrap"><table class="table"><thead><tr><th>文献</th><th>分类</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${data.items.length?data.items.map(item=>`<tr><td class="cell-title"><b>${escapeHtml(item.title)}</b><small>${escapeHtml((item.authors||[]).join(', '))}${item.year?' · '+item.year:''}${item.doi?' · '+escapeHtml(item.doi):''}</small></td><td>${escapeHtml(item.categoryName||'未分类')}</td><td><span class="badge ${item.status}">${{draft:'草稿',published:'已发布',withdrawn:'已下架'}[item.status]||item.status}</span></td><td>${formatTime(item.updatedAt)}</td><td><div class="inline"><button class="button edit-literature" data-id="${item.id}">编辑</button>${item.status!=='withdrawn'?`<button class="button danger unpublish" data-id="${item.id}">下架</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">没有匹配的文献。</td></tr>'}</tbody></table></div><div class="pager"><span>共 ${data.total} 条</span><button class="button" id="literaturePrev" ${data.page<=1?'disabled':''}>上一页</button><button class="button" id="literatureNext" ${data.page*data.limit>=data.total?'disabled':''}>下一页</button></div></div></section>`
    $('#literatureAdd').onclick=()=>{openDialog('新增文献',literatureForm());bindLiteratureForm()};$('#categoryAdd').onclick=categoryDialog;$('#bulkImport').onclick=bulkDialog;$('#literaturePrev').onclick=()=>{state.literaturePage-=1;renderLiterature()};$('#literatureNext').onclick=()=>{state.literaturePage+=1;renderLiterature()};$('#literatureFilter').onclick=()=>{state.literatureQuery=$('#literatureSearch').value.trim();state.literatureStatus=$('#literatureStatus').value;state.literaturePage=1;renderLiterature()};document.querySelectorAll('.edit-literature').forEach(button=>button.onclick=()=>{const item=data.items.find(x=>x.id===button.dataset.id);openDialog('编辑文献',literatureForm(item));bindLiteratureForm()});document.querySelectorAll('.unpublish').forEach(button=>button.onclick=async()=>{if(!confirm('确认下架这条文献？'))return;try{await api(`/v1/admin/literature/${button.dataset.id}/unpublish`,{method:'POST'});showToast('文献已下架');renderLiterature()}catch(error){showToast(error.message,true)}})}
  function bindLiteratureForm(){const form=$('#literatureForm');form.onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(form));const item={...values,authors:values.authors.split(/[;；]/).map(x=>x.trim()).filter(Boolean),keywords:values.keywords.split(/[,，;；]/).map(x=>x.trim()).filter(Boolean)};try{await api(values.id?`/v1/admin/literature/${values.id}`:'/v1/admin/literature',{method:values.id?'PATCH':'POST',body:JSON.stringify(item)});dialog.close();showToast('文献已保存');renderLiterature()}catch(error){showToast(error.message,true)}}}
  function categoryDialog(){openDialog('管理分类',`<div class="form-grid">${state.categories.map(c=>`<form class="category-edit panel" data-id="${c.id}" style="padding:14px"><label>分类名称<input name="name" value="${escapeHtml(c.name)}" required></label><label>英文标识<input name="slug" value="${escapeHtml(c.slug)}" required pattern="[a-z0-9_-]+"></label><div class="inline"><label style="flex:1">排序值<input name="sortOrder" type="number" value="${Number(c.sortOrder||0)}"></label><label style="display:flex;align-items:center;gap:8px;margin-top:24px"><input name="active" type="checkbox" style="width:auto" ${c.active?'checked':''}>启用</label><button class="button" style="margin-top:24px">保存</button></div></form>`).join('')||'<div class="notice">尚无分类。</div>'}<form id="categoryForm" class="form-grid"><h3>新增分类</h3><label>分类名称<input name="name" required></label><label>英文标识<input name="slug" required pattern="[a-z0-9_-]+"></label><label>说明<textarea name="description"></textarea></label><label>排序值<input name="sortOrder" type="number" value="0"></label><div class="dialog-actions"><button type="button" class="button" data-close>取消</button><button class="button primary">创建分类</button></div></form></div>`);document.querySelectorAll('.category-edit').forEach(form=>form.onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(form));try{await api(`/v1/admin/categories/${form.dataset.id}`,{method:'PATCH',body:JSON.stringify({...values,active:form.active.checked})});showToast('分类已更新');dialog.close();renderLiterature()}catch(error){showToast(error.message,true)}});$('#categoryForm').onsubmit=async event=>{event.preventDefault();try{await api('/v1/admin/categories',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});dialog.close();showToast('分类已创建');renderLiterature()}catch(error){showToast(error.message,true)}}}
  function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++;continue}if(c==='"'){quoted=!quoted;continue}if(c===','&&!quoted){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[];continue}cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);const headers=(rows.shift()||[]).map(x=>x.trim().toLowerCase().replace(/\s+/g,'_'));return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]||''])))}
  function bulkDialog(){openDialog('批量导入文献','<form id="bulkForm" class="form-grid"><div class="notice">支持 JSON 数组或 UTF-8 CSV。字段：title、authors、year、doi、url、abstract、keywords、categoryId、status、source、notes。authors 与 keywords 可用分号分隔。</div><label>选择文件<input name="file" type="file" accept=".json,.csv,application/json,text/csv" required></label><div class="dialog-actions"><button type="button" class="button" data-close>取消</button><button class="button primary">检查并导入</button></div></form>');$('#bulkForm').onsubmit=async event=>{event.preventDefault();const file=event.target.file.files[0];try{const text=await file.text();let items=file.name.toLowerCase().endsWith('.json')?JSON.parse(text):parseCsv(text);items=items.map(item=>({...item,authors:Array.isArray(item.authors)?item.authors:String(item.authors||'').split(/[;；]/),keywords:Array.isArray(item.keywords)?item.keywords:String(item.keywords||'').split(/[,，;；]/)}));const result=await api('/v1/admin/literature/bulk',{method:'POST',body:JSON.stringify({items})});dialog.close();showToast(`导入完成：新增 ${result.created}，更新 ${result.updated}，错误 ${result.errors.length}`);renderLiterature()}catch(error){showToast(error.message,true)}}}
  async function renderUsers(){const data=await api(`/v1/admin/users?page=${state.userPage}&limit=50`);content.innerHTML=`<section><div class="section-head"><div><h2>用户与余额</h2><p>余额调整会同时写入积分账本和管理员操作日志。</p></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>用户</th><th>状态</th><th>余额</th><th>累计购买</th><th>累计消耗</th><th>操作</th></tr></thead><tbody>${data.items.length?data.items.map(u=>`<tr><td class="cell-title"><b>${escapeHtml(u.displayName)}</b><small>${escapeHtml(u.email)}</small></td><td><span class="badge ${u.status}">${u.status}</span></td><td><b>${Number(u.balance).toLocaleString()}</b></td><td>${Number(u.purchasedTotal).toLocaleString()}</td><td>${Number(u.spentTotal).toLocaleString()}</td><td><div class="inline"><button class="button balance" data-id="${u.id}">调整余额</button><button class="button status" data-id="${u.id}" data-status="${u.status}">${u.status==='active'?'暂停':'恢复'}</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">暂无用户。</td></tr>'}</tbody></table></div><div class="pager"><span>共 ${data.total} 位用户</span><button class="button" id="userPrev" ${data.page<=1?'disabled':''}>上一页</button><button class="button" id="userNext" ${data.page*data.limit>=data.total?'disabled':''}>下一页</button></div></div></section>`;$('#userPrev').onclick=()=>{state.userPage--;renderUsers()};$('#userNext').onclick=()=>{state.userPage++;renderUsers()};document.querySelectorAll('.balance').forEach(button=>button.onclick=()=>balanceDialog(button.dataset.id));document.querySelectorAll('.status').forEach(button=>button.onclick=async()=>{const next=button.dataset.status==='active'?'suspended':'active';if(!confirm(`确认将用户状态改为 ${next}？`))return;try{await api(`/v1/admin/users/${button.dataset.id}/status`,{method:'PATCH',body:JSON.stringify({status:next})});showToast('用户状态已更新');renderUsers()}catch(error){showToast(error.message,true)}})}
  function balanceDialog(userId){openDialog('调整用户余额','<form id="balanceForm" class="form-grid"><label>积分变更<input name="delta" type="number" step="1" required placeholder="正数充值，负数扣除"></label><label>调整原因<textarea name="reason" required maxlength="500"></textarea></label><div class="notice">余额不能调整为负数。每次变更均可在操作日志中追溯。</div><div class="dialog-actions"><button type="button" class="button" data-close>取消</button><button class="button primary">确认调整</button></div></form>');$('#balanceForm').onsubmit=async event=>{event.preventDefault();try{await api(`/v1/admin/users/${userId}/balance`,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});dialog.close();showToast('余额已调整');renderUsers()}catch(error){showToast(error.message,true)}}}
  async function renderOrders(){const data=await api('/v1/admin/orders?limit=100');content.innerHTML=`<section><div class="section-head"><div><h2>订单管理</h2><p>人工订单先创建为 pending，确认收款后再入账，避免误充。</p></div><button class="button primary" id="orderCreate">新增人工订单</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>订单</th><th>用户</th><th>金额</th><th>积分</th><th>状态</th><th>操作</th></tr></thead><tbody>${data.items.length?data.items.map(x=>`<tr><td class="cell-title"><b>${escapeHtml(x.id)}</b><small>${formatTime(x.createdAt)} · ${escapeHtml(x.provider)}</small></td><td class="cell-title"><b>${escapeHtml(x.displayName)}</b><small>${escapeHtml(x.email)}</small></td><td>${formatMoney(x.amountCents,x.currency)}</td><td>${Number(x.credits).toLocaleString()}</td><td><span class="badge ${x.status}">${x.status}</span></td><td><div class="inline">${x.status==='pending'?`<button class="button order-status" data-id="${x.id}" data-status="paid">确认收款</button><button class="button danger order-status" data-id="${x.id}" data-status="cancelled">取消</button>`:''}${x.status==='paid'?`<button class="button danger order-status" data-id="${x.id}" data-status="refunded">退款并扣回积分</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">暂无订单。</td></tr>'}</tbody></table></div><div class="pager">共 ${data.total} 条</div></div></section>`;$('#orderCreate').onclick=manualOrderDialog;document.querySelectorAll('.order-status').forEach(button=>button.onclick=async()=>{if(!confirm(`确认将订单标记为 ${button.dataset.status}？`))return;try{await api(`/v1/admin/orders/${button.dataset.id}`,{method:'PATCH',body:JSON.stringify({status:button.dataset.status})});showToast('订单状态已更新');renderOrders()}catch(error){showToast(error.message,true)}})}
  async function manualOrderDialog(){let users;try{users=await api('/v1/admin/users?limit=200')}catch(error){showToast(error.message,true);return}openDialog('新增人工订单',`<form id="orderForm" class="form-grid"><label>用户<select name="userId" required><option value="">请选择</option>${users.items.map(u=>`<option value="${u.id}">${escapeHtml(u.displayName)} · ${escapeHtml(u.email)}</option>`).join('')}</select></label><label>积分<input name="credits" type="number" min="1" required></label><label>金额（分）<input name="amountCents" type="number" min="0" value="0" required></label><label>币种<select name="currency"><option value="cny">CNY</option><option value="usd">USD</option><option value="mop">MOP</option></select></label><label>备注<textarea name="note"></textarea></label><div class="notice">创建后不会立即加积分。请在订单列表中点击“确认收款”。</div><div class="dialog-actions"><button type="button" class="button" data-close>取消</button><button class="button primary">创建订单</button></div></form>`);$('#orderForm').onsubmit=async event=>{event.preventDefault();try{await api('/v1/admin/orders',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});dialog.close();showToast('人工订单已创建');renderOrders()}catch(error){showToast(error.message,true)}}}
  async function renderSimpleList(kind){const data=await api(`/v1/admin/${kind}?limit=100`),definitions={recharges:{title:'充值记录',cols:['记录号','用户','金额','积分','渠道','时间'],row:x=>[escapeHtml(x.id),`${escapeHtml(x.displayName)}<small>${escapeHtml(x.email)}</small>`,escapeHtml(formatMoney(x.amountCents,x.currency)),escapeHtml(x.credits),escapeHtml(x.provider),escapeHtml(formatTime(x.createdAt))]},logs:{title:'管理员操作日志',cols:['管理员','动作','对象','IP','详情','时间'],row:x=>[escapeHtml(x.username),escapeHtml(x.action),`${escapeHtml(x.entityType)}<small>${escapeHtml(x.entityId||'')}</small>`,escapeHtml(x.ip),`<small>${escapeHtml(JSON.stringify(x.metadata||{}))}</small>`,escapeHtml(formatTime(x.createdAt))]}},def=definitions[kind];content.innerHTML=`<section><div class="section-head"><div><h2>${def.title}</h2><p>${kind==='logs'?'后台写操作均在服务器端自动记录。':'数据来自 Cloud 权威账本。'}</p></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr>${def.cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${data.items.length?data.items.map(item=>`<tr>${def.row(item).map(value=>`<td class="cell-title">${value}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${def.cols.length}" class="empty">暂无${def.title}。</td></tr>`}</tbody></table></div><div class="pager">共 ${data.total??data.items.length} 条</div></div></section>`}
  async function renderAdmins(){const data=await api('/v1/admin/admins');content.innerHTML=`<section><div class="section-head"><div><h2>管理员与权限</h2><p>Owner 管理全部功能；Editor 管理文献；Finance 管理用户、订单与余额；Viewer 仅看概览。</p></div><button class="button primary" id="adminAdd">新增管理员</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>管理员</th><th>角色</th><th>状态</th><th>最后登录</th><th>操作</th></tr></thead><tbody>${data.items.map(x=>`<tr><td class="cell-title"><b>${escapeHtml(x.displayName)}</b><small>${escapeHtml(x.username)}</small></td><td><select class="admin-role" data-id="${x.id}">${data.roles.map(role=>`<option value="${role}" ${role===x.role?'selected':''}>${role}</option>`).join('')}</select></td><td><span class="badge ${x.active?'active':'suspended'}">${x.active?'启用':'停用'}</span></td><td>${formatTime(x.lastLoginAt)}</td><td><button class="button admin-save" data-id="${x.id}" data-active="${x.active}">保存角色</button> <button class="button danger admin-toggle" data-id="${x.id}" data-role="${x.role}" data-active="${x.active}">${x.active?'停用':'启用'}</button></td></tr>`).join('')}</tbody></table></div></div></section>`;$('#adminAdd').onclick=adminDialog;document.querySelectorAll('.admin-save').forEach(button=>button.onclick=async()=>{const role=document.querySelector(`.admin-role[data-id="${button.dataset.id}"]`).value;try{await api(`/v1/admin/admins/${button.dataset.id}`,{method:'PATCH',body:JSON.stringify({role,active:button.dataset.active==='true'})});showToast('管理员权限已更新');renderAdmins()}catch(error){showToast(error.message,true)}});document.querySelectorAll('.admin-toggle').forEach(button=>button.onclick=async()=>{try{await api(`/v1/admin/admins/${button.dataset.id}`,{method:'PATCH',body:JSON.stringify({role:button.dataset.role,active:button.dataset.active!=='true'})});showToast('管理员状态已更新');renderAdmins()}catch(error){showToast(error.message,true)}})}
  function adminDialog(){openDialog('新增管理员','<form id="adminForm" class="form-grid"><label>账号<input name="username" minlength="3" maxlength="64" required></label><label>显示名<input name="displayName" maxlength="80"></label><label>初始密码<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>角色<select name="role"><option value="viewer">Viewer</option><option value="editor">Editor</option><option value="finance">Finance</option><option value="owner">Owner</option></select></label><div class="notice">密码至少 12 位，必须同时包含字母和数字。</div><div class="dialog-actions"><button type="button" class="button" data-close>取消</button><button class="button primary">创建</button></div></form>');$('#adminForm').onsubmit=async event=>{event.preventDefault();try{await api('/v1/admin/admins',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});dialog.close();showToast('管理员已创建');renderAdmins()}catch(error){showToast(error.message,true)}}}
  async function renderBackups(){const data=await api('/v1/admin/backups');content.innerHTML=`<section><div class="section-head"><div><h2>数据库备份</h2><p>备份采用一致性快照、GZIP 压缩和 SHA-256 校验，默认保留 30 天。</p></div><button class="button primary" id="backupCreate">立即创建备份</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>备份时间</th><th>格式</th><th>大小</th><th>SHA-256</th><th>操作</th></tr></thead><tbody>${data.items.length?data.items.map(x=>`<tr><td>${formatTime(x.createdAt)}</td><td>${escapeHtml(x.format)}</td><td>${formatSize(x.sizeBytes)}</td><td class="cell-title"><small>${escapeHtml(x.sha256)}</small></td><td><button class="button download-backup" data-id="${x.id}">下载</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">尚未创建备份。</td></tr>'}</tbody></table></div></div></section>`;$('#backupCreate').onclick=async()=>{try{$('#backupCreate').disabled=true;const result=await api('/v1/admin/backups',{method:'POST'});showToast(`备份已创建：${formatSize(result.backup.sizeBytes)}`);renderBackups()}catch(error){showToast(error.message,true)}};document.querySelectorAll('.download-backup').forEach(button=>button.onclick=async()=>{try{const response=await api(`/v1/admin/backups/${button.dataset.id}/download`);const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`jiege-cloud-${button.dataset.id}.json.gz`;a.click();URL.revokeObjectURL(url)}catch(error){showToast(error.message,true)}})}
  $('#saveApi').onclick=async()=>{try{state.api=cleanApi($('#apiUrl').value);localStorage.setItem('jiege-cloud-api',state.api);await detect()}catch(error){showToast(error.message,true)}}
  $('#changeApi').onclick=()=>setAuthView('apiSetup')
  loginForm.onsubmit=async event=>{event.preventDefault();const error=$('#loginError');error.classList.add('hidden');try{const result=await api('/v1/admin/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(loginForm)))});state.token=result.token;state.admin=result.admin;sessionStorage.setItem('jiege-admin-token',state.token);enter()}catch(e){error.textContent=e.message;error.classList.remove('hidden')}}
  bootstrapForm.onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(bootstrapForm)),error=$('#bootstrapError');error.classList.add('hidden');try{await api('/v1/admin/bootstrap',{method:'POST',headers:{'x-bootstrap-token':values.bootstrapToken},body:JSON.stringify({username:values.username,displayName:values.displayName,password:values.password})});showToast('首位管理员已创建，请登录');setAuthView('loginForm')}catch(e){error.textContent=e.message;error.classList.remove('hidden')}}
  $('#logout').onclick=logout;$('#dialogClose').onclick=()=>dialog.close();dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});detect()
})()
